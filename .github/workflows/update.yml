name: Update events

on:
  schedule:
    - cron: "30 13 * * *"   # ~8:30 AM New York time, after the sheet's morning update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build events.json from the sheet
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scripts/build_data.py
      - name: Commit if changed
        run: |
          git config user.name "events-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update events"
          git push
